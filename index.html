<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sandbox</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      h1 {
        margin: 0;
        font-size: 3rem;
        font-weight: 700;
        letter-spacing: 2px;
        padding-left: 15px;
        padding-top: 15px;
      }

      ul {
        list-style: none;
        padding-left: 15px;
        margin: 0;
        width: 300px;
      }

      li {
        margin-bottom: 10px;
      }

      a {
        display: block;
        padding: 12px;
        color: #fff;
        text-decoration: none;
        font-size: 1rem;
        border: 1px solid #333;
        border-radius: 8px;
        background-color: #111;

        transition:
          background-color 0.2s ease,
          border-color 0.2s ease,
          transform 0.2s ease;
      }

      a:hover {
        background-color: #222;
        border-color: #fff;
        transform: translateY(-2px);
      }

      a:focus-visible {
        outline: 2px solid #fff;
        outline-offset: 4px;
      }
    </style>
  </head>

  <body>
    <h1>Demos</h1>
    <ul>
      <li>
        <a href="/demos/canvas-particles/">Canvas Particles</a>
      </li>
      <li>
        <a href="/demos/static-webgl2/">Static WebGL2</a>
      </li>
      <li>
        <a href="/demos/dynamic-webgl2/">Dynamic WebGL2</a>
      </li>
      <li>
        <a href="/demos/conways-game-of-life-webgpu/">Conway's Game of Life WebGPU</a>
      </li>
      <li>
        <a href="/demos/brick-pattern-webgpu/">Brick Pattern WebGPU</a>
      </li>
      <li>
        <a href="/demos/rubiks-cube-webgpu/">Rubik's Cube WebGPU</a>
      </li>
    </ul>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
