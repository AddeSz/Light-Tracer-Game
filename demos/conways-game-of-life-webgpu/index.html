<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGPU Life</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      h1 {
        margin: 0;
        padding: 0;
        font-size: 16px;
      }
      p {
        margin: 0;
        font-size: 13px;
      }

      button {
        cursor: pointer;
      }

      button:disabled {
        color: #444;
        cursor: default;
      }

      .layout {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        min-height: 100%;
      }

      .loading {
        visibility: hidden;
      }

      .col1 {
        grid-column: 1;
        display: flex;
        align-items: center;
        justify-content: end;
      }

      .col-content {
        display: flex;
        flex-direction: column;
        height: 800px;
        width: 120px;
        padding: 0px 10px;
        gap: 10px;
      }

      .col2 {
        grid-column: 2;
        display: flex;
        align-items: center;
      }

      #canvas {
        background-color: black;
        display: block;
        height: 800px;
        width: 800px;
      }

      .col3 {
        grid-column: 3;
        display: flex;
        align-items: center;
      }
    </style>
  </head>

  <body>
    <div class="layout loading">
      <div class="col1">
        <div class="col-content">
          <h1>Controls</h1>
          <button id="start-stop-button" disabled>Start</button>
          <button id="next-button" disabled>Next</button>
          <button id="reset-clear-button" disabled>Clear</button>
          <button id="generate-random-button">Generate Random</button>
        </div>
      </div>
      <div class="col2">
        <canvas id="canvas"></canvas>
      </div>
      <div class="col3">
        <div class="col-content">
          <h1>Stats</h1>
          <p id="count-label">Alive count: 0</p>
          <p id="step-label">Step Count: 0</p>
        </div>
      </div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
