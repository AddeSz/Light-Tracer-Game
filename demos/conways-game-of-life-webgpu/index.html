<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebGPU Life</title>
    <link rel="stylesheet" href="/src/style.css" />
    <style>
      .layout {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        min-height: 100vh;
      }

      .toolbar {
        grid-column: 1;
        display: flex;
        flex-direction: column;
        gap: 10px;
        padding: 20px;
        height: 100vh;
      }

      .toolbar button {
        width: 200px;
      }

      .canvas-container {
        grid-column: 2;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .spacer {
        grid-column: 3;
      }

      #canvas {
        background-color: black;
        display: block;
        width: 800px;
        height: 800px;
      }
    </style>
  </head>

  <body>
    <div class="layout">
      <div class="toolbar">
        <button>click</button>
      </div>
      <div class="canvas-container">
        <canvas id="canvas"></canvas>
      </div>
      <div class="spacer"></div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
