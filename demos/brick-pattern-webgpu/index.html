<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Brick Pattern WebGPU</title>
    <link rel="stylesheet" href="/src/style.css" />

    <style>
      .layout {
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        height: 100%;
      }

      .loading {
        visibility: hidden;
      }

      .container {
        height: 100%;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .controls {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        height: 800px;
        width: 220px;
        padding: 1rem;
        gap: 0.65rem;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgb(54, 54, 54);
        border-radius: 10px 0 0 10px;
      }

      .controls h1 {
        margin: 0 0 0.25rem;
        font-size: 1.1rem;
      }

      .controls label {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr auto;
        align-items: center;
        gap: 0.1rem;
        font-size: 0.8rem;
      }

      .controls output {
        min-width: 3rem;
        text-align: right;
        font-variant-numeric: tabular-nums;
        opacity: 0.75;
      }

      .controls input[type="range"] {
        grid-column: 1 / -1;
        appearance: none;
        width: 100%;
        height: 0.5rem;
        margin: 0.25rem 0 0.5rem;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.15);
        cursor: pointer;
      }

      .controls input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        width: 14px;
        height: 14px;
        border-radius: 50%;
        cursor: pointer;
        background: #e6e6e6;
      }

      .controls input[type="range"]::-moz-range-thumb {
        width: 14px;
        height: 14px;
        border: 0;
        border-radius: 50%;
        cursor: pointer;
        background: #e6e6e6;
      }

      .controls input[type="color"] {
        width: 2.5rem;
        height: 1.5rem;
        padding: 2px;
        border: none;
        border-radius: 1px;
        cursor: pointer;
      }

      #canvas {
        width: 800px;
        height: 800px;
      }
    </style>
  </head>

  <body>
    <div class="layout loading">
      <div class="container" style="justify-content: flex-end">
        <div class="controls">
          <h1>Controls</h1>

          <label>
            <span>Brick width</span>
            <output></output>
            <input type="range" data-param="brickWidth" min="20" max="300" step="1" />
          </label>

          <label>
            <span>Brick height</span>
            <output></output>
            <input type="range" data-param="brickHeight" min="10" max="150" step="1" />
          </label>

          <label>
            <span>Mortar size</span>
            <output></output>
            <input type="range" data-param="mortar" min="0" max="20" step="0.5" />
          </label>

          <label>
            <span>Offset X</span>
            <output></output>
            <input type="range" data-param="offsetX" min="0" max="300" step="1" />
          </label>

          <label>
            <span>Offset Y</span>
            <output></output>
            <input type="range" data-param="offsetY" min="0" max="300" step="1" />
          </label>

          <label>
            <span>Brick color</span>
            <input type="color" data-param="brickColor" />
          </label>

          <label>
            <span>Mortar color</span>
            <input type="color" data-param="mortarColor" />
          </label>
        </div>
      </div>
      <div class="container">
        <canvas id="canvas"></canvas>
      </div>
      <div class="container" style="justify-content: flex-start"></div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
